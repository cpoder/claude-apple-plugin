[project]
name = "apple-icloud-web-mcp"
version = "0.1.0"
description = "Optional MCP sidecar: iCloud web services without an official API (Find My, iCloud Drive, Photos, Notes, Reminders, Hide My Email) via pyicloud"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0,<3",
  "pyicloud>=2026.1",
]

[project.scripts]
apple-icloud-web-mcp = "apple_icloud_web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apple_icloud_web"]
