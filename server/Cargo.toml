[package]
name = "apple-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing Apple online services (App Store Connect, App Store Server, Apple Music, WeatherKit, Maps, CloudKit, APNs, Sign in with Apple, Business Manager, Search Ads, News, iCloud CalDAV/CardDAV/Mail, public Apple APIs)"
license = "MIT"
publish = false

[[bin]]
name = "apple-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form", "http2", "gzip", "multipart", "charset", "cookies", "stream"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8"] }
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"
flate2 = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
roxmltree = "0.21"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
mailparse = "0.16"
url = "2"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.4"
num-bigint = "0.4"
anyhow = "1"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
